# Contrato OpenAPI de @org/auth. A diferencia de los contratos generados por
# el skill nestjs-entity-lib-gen (users, etc.), este se escribe y mantiene a
# mano: Auth no es una entidad CRUD, es un conjunto de flujos de negocio.
openapi: 3.0.3
info:
  title: Auth API
  version: 1.0.0
tags:
  - name: Auth
paths:
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Autoregistro de un usuario ya invitado (crea sus credenciales en Firebase)
      description: >
        Solo funciona si el email ya existe como usuario invitado (fila creada
        por un administrador, con roleId/tenantId asignados y uid aún null).
        No crea sesión: el cliente debe llamar a /auth/login después.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Usuario enlazado a su nueva cuenta de Firebase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Email no autorizado (no invitado)
        '409':
          description: El usuario ya tiene una cuenta

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Inicia sesión validando un idToken de Firebase
      description: >
        Nunca acepta uid/email del cliente: se derivan del idToken verificado
        contra Firebase Admin SDK. Emite cookies httpOnly access_token y
        refresh_token; nunca devuelve los tokens en el body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Usuario no autorizado (no invitado) o desactivado

  /auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      summary: Emite un nuevo access token a partir de la cookie refresh_token
      responses:
        '200':
          description: Access token renovado
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Refresh token ausente, inválido, revocado o expirado

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoca el refresh token de la sesión actual
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Sesión cerrada
        '401':
          description: No autenticado

  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [Auth]
      summary: Revoca todos los refresh tokens del usuario (todas las sesiones/dispositivos)
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Todas las sesiones cerradas
        '401':
          description: No autenticado

  /auth/me:
    get:
      operationId: me
      tags: [Auth]
      summary: Devuelve el perfil del usuario autenticado
      security:
        - accessTokenCookie: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No autenticado

  /auth/update-profile:
    post:
      operationId: updateProfile
      tags: [Auth]
      summary: Actualiza campos de perfil del propio usuario autenticado
      description: Solo permite displayName/photoUrl/name. Nunca email/uid/roleId/tenantId/isActive.
      security:
        - accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: No autenticado

components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    User:
      type: object
      description: Ver el contrato completo en libs/backend/users/openapi/user.openapi.yaml.
      properties:
        id:
          type: string
          format: uuid
        uid:
          type: string
          nullable: true
        email:
          type: string
        displayName:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
    RegisterDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginDto:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: ID token de Firebase obtenido en el cliente (Firebase JS SDK)
    UpdateProfileDto:
      type: object
      properties:
        displayName:
          type: string
        photoUrl:
          type: string
        name:
          type: string